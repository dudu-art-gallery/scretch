<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0d0d;
  --text:#f2f2f2;
  --muted:#888;
  --accent:#8B2C2C;
}

body.abstract{
  --bg:#8B2C2C;
  --accent:#000000;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  transition:background 0.8s ease;
  overflow-x:hidden;
}

/* TOP BAR */

.mode-switch{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  padding:18px 20px;
  z-index:1000;
  transition:0.4s ease;
  flex-wrap:wrap;
}

.mode-switch.scrolled{
  backdrop-filter: blur(14px);
  background: rgba(0,0,0,0.35);
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.switch{
  width:60px;
  height:28px;
  border:1px solid var(--text);
  border-radius:50px;
  position:relative;
  cursor:pointer;
}

.switch::before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  background:var(--accent);
  top:2px;
  left:3px;
  border-radius:50%;
  transition:0.4s ease;
}

body.cubism .switch::before{
  transform:translateX(32px);
  border-radius:0;
}

.contact-btn,.rental-btn,.lang-btn{
  border:1px solid var(--text);
  background:transparent;
  color:var(--text);
  padding:8px 14px;
  font-size:13px;
  cursor:pointer;
  transition:0.3s;
  white-space:nowrap;
}

.contact-btn:hover,
.rental-btn:hover,
.lang-btn:hover{
  background:var(--accent);
  color:#000;
}

/* INTRO */

section.intro{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:120px 20px 60px;
}

.intro h2{
  font-family:'Cormorant Garamond',serif;
  font-size:60px;
  margin-bottom:30px;
}

.intro p{
  max-width:600px;
  color:var(--muted);
  line-height:2;
}

/* ART */

.artwork{
  display:none;
  flex-direction:column;
  align-items:center;
}

body.cubism .cubism-art,
body.abstract .abstract-art{
  display:flex;
}

.art-container{
  width:90%;
  max-width:900px;
  margin-bottom:220px;
  position:relative;
  text-align:center;
}

.art-container img{
  width:100%;
  cursor:pointer;
  transition:0.3s ease;
}

body.cubism .art-container img{
  clip-path: polygon(0 0, 100% 10%, 90% 100%, 10% 90%);
  transform: rotate(-2deg);
}

/* NOTES */

.note{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  background:rgba(0,0,0,0.9);
  opacity:0;
  pointer-events:none;
  transition:0.4s ease;
}

.art-container.active .note{
  opacity:1;
  pointer-events:auto;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.4s ease;
  z-index:2000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

</style>
</head>

<body class="cubism">

<div class="mode-switch" id="topBar">
  <span>Abstract</span>
  <div class="switch" onclick="toggleMode()"></div>
  <span>Cubism</span>
  <button class="rental-btn" data-en="Art-Rental" data-de="Kunstvermietung">Art-Rental</button>
  <button class="contact-btn" data-en="Contact" data-de="Kontakt">Contact</button>
  <button class="lang-btn" onclick="toggleLanguage()">DE</button>
</div>

<section class="intro">
  <h2 id="title">Voices in the Darkness</h2>
  <p id="subtitle">We create upon request!</p>
</section>

<section class="artwork cubism-art">
  <div class="art-container">
    <img src="images/P1.jpeg">
    <div class="note" data-en="Geometric fracture of perception."
         data-de="Geometrische Fragmentierung der Wahrnehmung.">
      Geometric fracture of perception.
    </div>
  </div>
</section>

<section class="artwork abstract-art">
  <div class="art-container">
    <img src="images/schizophrenia.jpeg">
    <div class="note"
         data-en="Chaos dissolving into silence."
         data-de="Chaos, das sich in Stille auflöst.">
      Chaos dissolving into silence.
    </div>
  </div>
</section>

<div class="overlay" id="contactPanel">
  <h2 data-en="Contact" data-de="Kontakt">Contact</h2>
  <p>Durali Demir</p>
  <p>d.demir@dudu-art-gallery.com</p>
  <button onclick="closePanels()">Close</button>
</div>

<script>

/* MODE TOGGLE */
function toggleMode(){
  const body=document.body;
  body.classList.toggle("abstract");
  body.classList.toggle("cubism");
}

/* LANGUAGE TOGGLE */
let currentLang="en";

function toggleLanguage(){
  currentLang = currentLang==="en" ? "de" : "en";
  document.querySelector(".lang-btn").innerText =
    currentLang==="en" ? "DE" : "EN";

  document.getElementById("title").innerText =
    currentLang==="en"
    ? "Voices in the Darkness"
    : "Stimmen in der Dunkelheit";

  document.getElementById("subtitle").innerText =
    currentLang==="en"
    ? "This is just the beginning. We create upon request."
    : "Dies ist erst der Anfang. Wir schaffen auf Anfrage.";

  document.querySelectorAll("[data-en]").forEach(el=>{
    el.innerText = el.getAttribute("data-"+currentLang);
  });
}

/* NOTES */
document.querySelectorAll('.art-container').forEach(container=>{
  const img=container.querySelector('img');
  const note=container.querySelector('.note');
  img.addEventListener('click',()=>container.classList.add('active'));
  note.addEventListener('click',(e)=>{
    e.stopPropagation();
    container.classList.remove('active');
  });
});

/* SCROLL BLUR */
window.addEventListener("scroll",()=>{
  const topBar=document.getElementById("topBar");
  if(window.scrollY>50){
    topBar.classList.add("scrolled");
  }else{
    topBar.classList.remove("scrolled");
  }
});

</script>

</body>
</html>
