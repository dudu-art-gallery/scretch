<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU - Art Rental Gallery</title>

<link rel="icon" type="images/png" href="images/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#0d0d0d;
  --muted:#555;
  --accent:#8B2C2C;
}

body.abstract{
  --bg:#0d0d0d;
  --text:#f2f2f2;
  --muted:#888;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  transition:background 0.8s ease;
}

/* ENTRY */

.entry{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10000;
  transition:opacity 1s ease;
}

.entry.hidden{opacity:0;pointer-events:none;}

.entry h1{
  font-family:'Cormorant Garamond',serif;
  font-size:80px;
  color:#fff;
  letter-spacing:8px;
  animation:fadeIn 2s forwards;
}

/* TOP BAR */

.mode-switch{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:12px;
  z-index:1000;
}

/* MENU BUTTON RIGHT */

.menu-btn{
  position:absolute;
  right:20px;
  top:10px;
}

.bottom-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

/* BUTTON STYLE */

button{
  border:1px solid var(--text);
  background:transparent;
  color:var(--text);
  padding:8px 14px;
  font-size:13px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:var(--accent);
  color:#000;
}

/* SWITCH */

.switch{
  width:60px;
  height:28px;
  background:#000;
  border-radius:50px;
  position:relative;
  cursor:pointer;
}

.switch::before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  background:#fff;
  top:3px;
  left:4px;
  border-radius:50%;
  transition:0.4s;
}

body.cubism .switch::before{
  transform:translateX(30px);
}

/* SIDE MENU */

.side-menu{
  position:fixed;
  top:0;
  right:-280px;
  width:260px;
  height:100vh;
  background:rgba(10,10,10,0.9);
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  transition:0.4s;
  z-index:3000;
}

.side-menu.active{
  right:0;
}

.menu-close{
  position:absolute;
  top:20px;
  right:20px;
}

/* INTRO */

.intro{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

.intro h2{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;
  margin-bottom:20px;
}

.intro p{
  max-width:700px;
  color:var(--muted);
}

/* OVERLAYS */

.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.4s;
  z-index:2000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

.profile-pic{
  width:150px;
  height:150px;
  border-radius:50%;
  margin-bottom:20px;
}

/* ANIMATION */

@keyframes fadeIn{
  to{opacity:1;}
}
</style>
</head>

<body class="cubism">

<div class="entry" id="entryScreen"><h1>DUDU</h1></div>

<div class="mode-switch">

<button class="menu-btn" onclick="toggleMenu()">Menu</button>

<div class="bottom-row">
<span>Abstract</span>
<div class="switch" onclick="toggleMode()"></div>
<span>Cubism</span>
</div>

</div>

<!-- SIDE MENU -->

<div class="side-menu" id="sideMenu">

<button class="menu-close" onclick="toggleMenu()">✕</button>

<button onclick="openContact()">Contact</button>
<button onclick="openRental()">Art-Rental</button>
<button class="lang-btn" onclick="toggleLanguage()">DE</button>

</div>

<section class="intro">
<h2 id="title">art rental gallery</h2>
<p id="subtitle">we create upon request.</p>
</section>

<!-- CONTACT -->

<div class="overlay" id="contactPanel">

<img src="images/Durali Demir.jpg" class="profile-pic">

<h2>Durali Demir</h2>
<p>Founder & Curator</p>
<p>d.demir@dudu-art-gallery.com</p>
<p>Munich, Germany</p>

<button onclick="closePanels()">Back</button>

</div>

<!-- RENTAL -->

<div class="overlay" id="rentalPanel">

<h2>Art-Rental</h2>

<div style="width:90%;max-width:900px;height:70vh;margin:30px 0;">
<iframe src="images/Art-Rental.pdf" style="width:100%;height:100%;border:none;"></iframe>
</div>

<a href="images/Art-Rental.pdf" download>Download PDF</a>

<button onclick="closePanels()">Back</button>

</div>

<script>

/* ENTRY */

window.addEventListener("load",()=>{
setTimeout(()=>{
document.getElementById("entryScreen").classList.add("hidden");
},3000);
});

/* MODE */

function toggleMode(){
document.body.classList.toggle("abstract");
document.body.classList.toggle("cubism");
}

/* MENU */

function toggleMenu(){
document.getElementById("sideMenu").classList.toggle("active");
}

/* OPEN PANELS */

function openContact(){
toggleMenu();
document.getElementById("contactPanel").classList.add("active");
}

function openRental(){
toggleMenu();
document.getElementById("rentalPanel").classList.add("active");
}

/* CLOSE PANELS */

function closePanels(){
document.querySelectorAll(".overlay").forEach(p=>p.classList.remove("active"));
toggleMenu();
}

/* LANGUAGE */

let lang='de';

function applyLanguage(){

document.getElementById('title').textContent=(lang==='en')
? 'art rental gallery'
: 'Galerie zur Kunstvermietung';

document.getElementById('subtitle').textContent=(lang==='en')
? 'We create upon request.'
: 'Wir kreieren auf Anfrage.';

document.querySelector(".lang-btn").textContent=(lang==='en')
? 'DE'
: 'EN';

}

function toggleLanguage(){
lang=(lang==='en')?'de':'en';
applyLanguage();
}

document.addEventListener("DOMContentLoaded",applyLanguage);

</script>

</body>
</html>
