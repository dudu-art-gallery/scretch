<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #ffffff;
  --text: #111111;
  --soft: #f4f4f4;
}

body.dark {
  --bg: #0f0f0f;
  --text: #f5f5f5;
  --soft: #1a1a1a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.4s ease;
}

/* HEADER */

header {
  position: fixed;
  width: 100%;
  padding: 30px 60px;
  display: flex;
  justify-content: space-between;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
}

body.dark header {
  background: rgba(15,15,15,0.85);
}

nav a {
  margin-left: 40px;
  text-decoration: none;
  color: var(--text);
  font-size: 14px;
  letter-spacing: 2px;
}

/* HERO */

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-top: 80px;
  text-align: center;
}

.hero h1 {
  font-weight: 400;
  font-size: 48px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.hero p {
  color: #777;
  margin-bottom: 60px;
}

.hero img {
  width: 70%;
  max-width: 1000px;
  transition: 0.8s ease;
}

.hero img:hover {
  transform: scale(1.02);
}

/* SECTION */

.section {
  padding: 160px 100px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 80px;
}

.card img {
  width: 100%;
  cursor: pointer;
  transition: 0.6s ease;
}

.card img:hover {
  transform: scale(1.03);
}

.card-title {
  margin-top: 20px;
  font-size: 14px;
  letter-spacing: 2px;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.modal img {
  max-width: 85%;
  max-height: 85%;
}

.modal.active {
  display: flex;
}

/* FOOTER */

footer {
  padding: 120px 100px;
  background: var(--soft);
  line-height: 2;
}

/* MOBILE */

@media (max-width: 900px) {
  header { padding: 20px 30px; }
  .grid { grid-template-columns: 1fr; }
  .section { padding: 80px 30px; }
  .hero img { width: 90%; }
}

</style>
</head>
<body>

<header>
  <div>DUDU</div>
  <nav>
    <a href="#collection">COLLECTION</a>
    <a href="#contact">CONTACT</a>
    <a href="#" onclick="toggleDark()">MODE</a>
  </nav>
</header>

<section class="hero">
  <h1>dudu art gallery</h1>
  <p>every masterpiece was once a scratch</p>
  <img src="images/busniess card.jpeg">
</section>

<section class="section" id="collection">
  <div class="grid">

    <div class="card">
      <img src="images/P1.jpeg" onclick="openModal(this)">
      <div class="card-title">P1</div>
    </div>

    <div class="card">
      <img src="images/fell in love.jpeg" onclick="openModal(this)">
      <div class="card-title">FELL IN LOVE</div>
    </div>

    <div class="card">
      <img src="images/P2.jpeg" onclick="openModal(this)">
      <div class="card-title">P2</div>
    </div>

  </div>
</section>

<footer id="contact">
  <strong>DUDU ART GALLERY</strong><br>
  81929 Munich<br>
  +49 176 416 292 50<br>
  d.demir@dudu-art-gallery.com
</footer>

<div class="modal" id="modal" onclick="closeModal()">
  <img id="modal-img">
</div>

<script>

function openModal(img){
  document.getElementById("modal-img").src = img.src;
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
