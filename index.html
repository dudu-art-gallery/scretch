<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DUDU Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --bg:#fff;
  --text:#111;
  --soft:#f5f5f5;
}

body.dark {
  --bg:#0e0e0e;
  --text:#f5f5f5;
  --soft:#1a1a1a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Montserrat',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s ease;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

header {
  position:fixed;
  width:100%;
  padding:20px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  z-index:1000;
}

body.dark header {
  background:rgba(15,15,15,.85);
}

.logo {
  letter-spacing:3px;
  font-weight:500;
}

.menu-toggle {
  font-size:26px;
  cursor:pointer;
  display:none;
}

nav {
  display:flex;
  gap:30px;
  align-items:center;
}

nav a {
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  letter-spacing:2px;
}

/* ================= MOBILE MENU ================= */

.mobile-menu {
  position:fixed;
  top:0;
  right:-100%;
  width:70%;
  height:100%;
  background:var(--bg);
  padding:100px 30px;
  display:flex;
  flex-direction:column;
  gap:30px;
  transition:.4s ease;
  z-index:1500;
}

.mobile-menu.active {
  right:0;
}

.mobile-menu a {
  font-size:18px;
}

/* ================= HERO ================= */

.hero {
  padding-top:120px;
  padding-bottom:80px;
  text-align:center;
}

.hero h1 {
  font-size:32px;
  margin-bottom:15px;
}

.hero p {
  font-size:15px;
  margin-bottom:40px;
  color:gray;
}

.hero img {
  width:92%;
  max-width:1000px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}

/* ================= COLLECTION ================= */

.section {
  padding:70px 20px;
}

.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:40px;
}

.card img {
  width:100%;
}

.card-info {
  margin-top:15px;
  font-size:14px;
  letter-spacing:2px;
}

button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:1px solid var(--text);
  background:transparent;
  font-size:14px;
  letter-spacing:2px;
}

button:active {
  transform:scale(.97);
}

/* ================= MODAL ================= */

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:2000;
}

.modal img {
  max-width:100%;
  max-height:90%;
}

.modal.active {
  display:flex;
}


/* ================= DESKTOP ================= */

@media(min-width:900px){

  .menu-toggle { display:none; }

  nav { display:flex; }

  .mobile-menu { display:none; }

  .hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .hero h1 { font-size:50px; }

  .grid {
    grid-template-columns:repeat(3,1fr);
    gap:60px;
  }

  .section { padding:120px 100px; }

}

@media(max-width:899px){
  nav { display:none; }
  .menu-toggle { display:block; }
}

</style>
</head>
<body>

<header>
  <div class="logo">DUDU</div>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <nav>
    <a href="#collection">COLLECTION</a>
    <a href="#contact">CONTACT</a>
    <a href="#" onclick="toggleDark()">MODE</a>
  </nav>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="#collection" onclick="toggleMenu()">COLLECTION</a>
  <a href="#contact" onclick="toggleMenu()">CONTACT</a>
  <a href="#" onclick="toggleDark()">MODE</a>
</div>

<section class="hero">
  <h1>dudu art gallery</h1>
  <p>every masterpiece was once a scratch</p>
  <img src="images/busniess card.jpeg">
</section>

<section class="section" id="collection">
  <div class="grid">

    <div class="card" onclick="openModal(this)">
      <img src="images/P1.jpeg">
      <div class="card-info">P1</div>
    </div>

    <div class="card" onclick="openModal(this)">
      <img src="images/fell in love.jpeg">
      <div class="card-info">FELL IN LOVE</div>
    </div>

    <div class="card" onclick="openModal(this)">
      <img src="images/P2.jpeg">
      <div class="card-info">P2</div>
    </div>

  </div>
</section>

<footer id="contact" class="section">
  <strong>DUDU ART GALLERY</strong><br><br>
  81929 Munich<br>
  +49 176 416 292 50<br>
  d.demir@dudu-art-gallery.com
</footer>

<div class="modal" id="modal" onclick="closeModal()">
  <img id="modal-img">
</div>

<script>


function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("active");
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

function openModal(card){
  const img = card.querySelector("img").src;
  document.getElementById("modal-img").src = img;
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

</script>

</body>
</html>
