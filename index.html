<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dudu art gallery</title>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: #ffffff;
  color: #111;
  overflow-x: hidden;
}

/* ================= NAVIGATION ================= */

header {
  width: 100%;
  padding: 20px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  z-index: 1000;
}

.logo {
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 2px;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 40px;
}

nav a {
  text-decoration: none;
  color: #111;
  font-weight: 400;
  transition: 0.3s;
}

nav a:hover {
  opacity: 0.5;
}

.hamburger {
  display: none;
  font-size: 26px;
  cursor: pointer;
}

/* ================= HERO ================= */

.hero {
  margin-top: 120px;
  text-align: center;
  padding: 40px 20px;
}

.hero h1 {
  font-size: 48px;
  font-weight: 500;
  margin-bottom: 10px;
  animation: fadeDown 1.2s ease forwards;
}

.hero p {
  font-size: 20px;
  color: #555;
  margin-bottom: 40px;
  animation: fadeUp 1.5s ease forwards;
}

.hero img {
  width: 80%;
  max-width: 1000px;
  border-radius: 4px;
  transition: transform 0.6s ease;
  animation: fadeUp 2s ease forwards;
}

.hero img:hover {
  transform: scale(1.02);
}

/* ================= CATEGORY SECTION ================= */

.section {
  padding: 100px 60px;
}

.section h2 {
  font-size: 26px;
  margin-bottom: 30px;
  text-transform: lowercase;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}

.card {
  background: #f8f8f8;
  padding: 15px;
  transition: 0.4s;
  cursor: pointer;
  opacity: 0;
  transform: translateY(40px);
}

.card img {
  width: 100%;
  margin-bottom: 10px;
}

.card:hover {
  transform: translateY(-5px);
}

.card-title {
  font-size: 14px;
  display: flex;
  justify-content: space-between;
}

/* ================= FOOTER ================= */

footer {
  background: #f2f2f2;
  padding: 60px;
  font-size: 14px;
  line-height: 1.8;
}

/* ================= ANIMATIONS ================= */

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= MOBILE ================= */

@media (max-width: 900px) {

  header {
    padding: 20px;
  }

  nav ul {
    position: absolute;
    top: 80px;
    right: 0;
    background: white;
    flex-direction: column;
    width: 200px;
    padding: 30px;
    display: none;
  }

  nav ul.active {
    display: flex;
  }

  .hamburger {
    display: block;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 32px;
  }

  .hero img {
    width: 100%;
  }

  .section {
    padding: 60px 20px;
  }

  footer {
    padding: 40px 20px;
  }
}

</style>
</head>
<body>

<header>
  <div class="logo">dudu</div>

  <nav>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <ul id="menu">
      <li><a href="#cubism">cubism</a></li>
      <li><a href="#contact">contact</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <h1>dudu art gallery</h1>
  <p>every masterpiece was once a scratch</p>
  <img src="images/busnieess card.jpeg">
</section>

<section class="section" id="cubism">
    <div class="grid">
    <div class="card">
      <img src="images/P1.jpeg">
      <div class="card-title">
        <span>P1</span>
      </div>
    </div>
    <div class="grid">
    <div class="card">
      <img src="images/fell in love.jpeg">
      <div class="card-title">
        <span>fell in love</span>
      </div>
    </div>
  </div>
</section>
    <div class="grid">
    <div class="card">
      <img src="images/P2.jpeg">
      <div class="card-title">
        <span>P2</span>
      </div>
    </div>
  </div>
</section>


<footer id="contact">
  <p><strong>dudu art gallery</strong></p>
    <p>81929 Munich</p>
  <p>+49 176 416 292 50</p>
  <p>d.demir@dudu-art-gallery.com</p>
</footer>

<script>

function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}

/* Scroll Animation */
const cards = document.querySelectorAll('.card');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.style.opacity = 1;
      entry.target.style.transform = "translateY(0)";
    }
  });
}, { threshold: 0.2 });

cards.forEach(card => observer.observe(card));

</script>

</body>
</html>
