<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU - Art Rental Gallery</title>

<link rel="icon" type="images/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

:root{
--bg:#ffffff;
--text:#0d0d0d;
--muted:#555;
--accent:#8B2C2C;
}

body.abstract{
--bg:#0d0d0d;
--text:#f2f2f2;
--muted:#888;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
color:var(--text);
font-family:'Inter',sans-serif;
transition:background 0.8s ease;
}

/* ENTRY */

.entry{
position:fixed;
inset:0;
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
z-index:10000;
transition:opacity 1s ease;
}

.entry.hidden{
opacity:0;
pointer-events:none;
}

.entry h1{
font-family:'Cormorant Garamond',serif;
font-size:80px;
letter-spacing:8px;
animation:fadeIn 1s forwards;
}

/* TOP BAR */

.mode-switch{
position:fixed;
top:0;
left:0;
width:100%;
padding:12px;
z-index:1000;
}

.menu-btn{
position:absolute;
right:20px;
top:10px;
}

/* SWITCH */

.bottom-row{
display:flex;
justify-content:center;
align-items:center;
gap:8px;
}

.switch{
width:60px;
height:28px;
background:#000;
border-radius:50px;
position:relative;
cursor:pointer;
}

.switch::before{
content:"";
position:absolute;
width:22px;
height:22px;
background:#fff;
top:3px;
left:4px;
border-radius:50%;
transition:0.4s;
}

body.cubism .switch::before{
transform:translateX(30px);
}

/* BUTTON */

button{
border:1px solid var(--text);
background:transparent;
color:var(--text);
padding:8px 14px;
font-size:13px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:var(--accent);
color:#000;
}

/* SIDE MENU */

.side-menu{
position:fixed;
top:0;
right:-280px;
width:260px;
height:100vh;
background:rgba(10,10,10,0.9);
backdrop-filter:blur(14px);
display:flex;
flex-direction:column;
align-items:flex-end;
padding:80px 30px;
gap:20px;
transition:0.4s;
z-index:3000;
color:#fff;
}

.side-menu.active{
right:0;
}

/* INTRO */

.intro{
min-height:45vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.intro h2{
font-family:'Cormorant Garamond',serif;
font-size:24px;
margin-bottom:10px;
}

.intro p{
max-width:700px;
color:var(--muted);
margin-bottom:80px;
}

/* GALLERY */

.gallery{
padding:40px 20px;
text-align:center;
}

.gallery h2{
font-family:'Cormorant Garamond',serif;
font-size:28px;
margin-bottom:60px;
}

.gallery-grid{
display:grid;
grid-template-columns:1fr;
gap:300px;
justify-items:center;
margin-bottom:100px;
}

.gallery-grid img{
width:80%;
max-width:500px;
box-shadow:0 8px 30px rgba(0,0,0,0.25);
}

/* HISTORY PAGE */

#paintingPage{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
min-height:100vh;
background:#e5e5e5;
text-align:center;
padding-top:90px;
animation:fadePage 0.4s ease;
}

#paintingImage{
max-width:350px;
margin:40px auto;
display:block;
}

#paintingHistory{
max-width:600px;
margin:auto;
}

#paintingHistory p{
color:#000;
line-height:1.7;
margin:12px auto;
font-size:16px;
}

.nav-arrow{
position:fixed;
top:50%;
transform:translateY(-50%);
font-size:40px;
cursor:pointer;
color:#000;
}

#prevArrow{ left:20px; }
#nextArrow{ right:20px; }

.backBtn{
margin-top:30px;
background:#000;
color:#fff;
border:2px solid #000;
}

.backBtn:hover{
background:#fff;
color:#000;
}

/* ANIMATIONS */

@keyframes fadeIn{to{opacity:1;}}

@keyframes fadePage{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body class="cubism">

<div class="entry" id="entryScreen"><h1>DUDU</h1></div>

<div class="mode-switch">
<button class="menu-btn" onclick="toggleMenu()">Menu</button>

<div class="bottom-row">
<span>Abstract</span>
<div class="switch" onclick="toggleMode()"></div>
<span>Cubism</span>
</div>
</div>

<div id="mainContent">

<section class="intro">
<h2>art rental gallery</h2>
<p>we create upon request.</p>
</section>

<section class="gallery">

<h2>Cubism</h2>

<div class="gallery-grid">

<div>
<img src="images/P1.jpeg">
<p>P1</p>
<button onclick="openPainting('p1')">History</button>
</div>

<div>
<img src="images/P2.jpg">
<p>P2</p>
<button onclick="openPainting('p2')">History</button>
</div>

</div>

</section>

</div>

<div id="paintingPage">

<h2 id="paintingTitle"></h2>
<img id="paintingImage">
<div id="paintingHistory"></div>

<div id="prevArrow" class="nav-arrow" onclick="navigatePainting(-1)">&#10094;</div>
<div id="nextArrow" class="nav-arrow" onclick="navigatePainting(1)">&#10095;</div>

<button class="backBtn" onclick="goBack()">Back</button>

</div>

<script>

window.addEventListener("load",()=>{
const entry=document.getElementById("entryScreen");
setTimeout(()=>{
entry.classList.add("hidden");
entry.addEventListener("transitionend",()=>{entry.style.display="none";});
},1000);
});

function toggleMenu(){
document.getElementById("sideMenu").classList.toggle("active");
}

function toggleMode(){
document.body.classList.toggle("abstract");
document.body.classList.toggle("cubism");
}

const paintings=[
{id:"p1",title:"P1",image:"images/P1.jpeg",history:"Red doesn't ask for life. It takes it."},
{id:"p2",title:"P2",image:"images/P2.jpg",history:"Yellow doesn't ask for light. It takes it."}
];

let currentIndex=0;

function openPainting(id){

currentIndex=paintings.findIndex(p=>p.id===id);

document.getElementById("mainContent").style.display="none";
document.getElementById("paintingPage").style.display="block";

showPainting(currentIndex);

window.scrollTo(0,0);
}

function showPainting(index){

const p=paintings[index];

document.getElementById("paintingTitle").textContent=p.title;
document.getElementById("paintingImage").src=p.image;

const historyDiv=document.getElementById("paintingHistory");
historyDiv.innerHTML="";

const sentences=p.history.split(". ");

sentences.forEach((s,i)=>{
const pEl=document.createElement("p");
pEl.textContent=s.endsWith(".")?s:s+".";
pEl.style.opacity="0";
pEl.style.transition=`opacity 0.5s ease ${i*0.2}s`;
historyDiv.appendChild(pEl);
setTimeout(()=>{pEl.style.opacity="1";},50);
});
}

function navigatePainting(direction){

currentIndex+=direction;

if(currentIndex<0) currentIndex=paintings.length-1;
if(currentIndex>=paintings.length) currentIndex=0;

showPainting(currentIndex);
}

function goBack(){
document.getElementById("paintingPage").style.display="none";
document.getElementById("mainContent").style.display="block";
window.scrollTo(0,0);
}

</script>

</body>
</html>
