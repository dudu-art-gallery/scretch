<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0a0a;
  --text:#f2f2f2;
  --muted:#888;
  --accent:#8B2C2C;
  --radius:0px;
}

body.abstract {
  --bg:#8B2C2C;
  --accent:#000000;
  --radius:0px;
}

body.cubism {
  --bg:#0d0d0d;
  --accent:#8B2C2C;
  --radius:0px;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  transition:background 1s ease;
}

/* ---------------- TOP BAR FIX ---------------- */

.mode-switch{
  position:fixed;
  top:20px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:1000;
  padding:10px 20px;
  flex-wrap:wrap;
  background:transparent;
}

.mode-switch span{
  font-size:14px;
}

.switch{
  width:60px;
  height:28px;
  border:1px solid var(--text);
  border-radius:50px;
  position:relative;
  cursor:pointer;
  flex-shrink:0;
}

.switch::before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  background:var(--accent);
  top:2px;
  left:3px;
  border-radius:50%;
  transition:.4s;
}

body.cubism .switch::before{
  transform: translateX(32px);
  border-radius:0;
}

.contact-btn, .rental-btn{
  border:1px solid var(--text);
  background:transparent;
  color:var(--text);
  padding:8px 14px;
  font-size:13px;
  cursor:pointer;
  border-radius:var(--radius);
  transition:.3s;
  white-space:nowrap;
}

.contact-btn:hover,
.rental-btn:hover{
  background:var(--accent);
  color:#000;
}

/* Extra small phones */
@media(max-width:380px){
  .contact-btn,
  .rental-btn{
    padding:6px 10px;
    font-size:12px;
  }
  .switch{
    width:55px;
    height:26px;
  }
}

/* -------------- REST OF DESIGN -------------- */

section.intro{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  min-height:100vh;
  padding:120px 20px 60px;
}

.intro h2{
  font-family:'Cormorant Garamond',serif;
  font-size:60px;
  margin-bottom:30px;
}

.intro p{
  max-width:600px;
  line-height:2;
  color:var(--muted);
}

.artwork{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.art-container{
  width:90%;
  max-width:900px;
  margin-bottom:200px;
  text-align:center;
  position:relative;
}

.art-container img{
  width:100%;
  cursor:pointer;
  transition:0.3s ease;
}

.art-container img:hover{
  transform:scale(1.02);
}

body.cubism .art-container img{
  clip-path: polygon(0 0, 100% 10%, 90% 100%, 10% 90%);
  transform: rotate(-2deg);
}

.note{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:0.4s ease;
  padding:20px;
}

.art-container.active .note{
  opacity:1;
  pointer-events:auto;
}

.abstract-art,
.cubism-art{
  display:none;
}

body.abstract .abstract-art,
body.cubism .cubism-art{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.5s ease;
  z-index:2000;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

</style>
</head>

<body class="cubism">

<div class="mode-switch">
  <span>Abstract</span>
  <div class="switch" onclick="toggleMode()"></div>
  <span>Cubism</span>
  <button class="rental-btn" onclick="openRental()">Art-Rental</button>
  <button class="contact-btn" onclick="openContact()">Contact</button>
</div>

<section class="intro">
  <h2>Voices in the Darkness</h2>
  <p>We create upon request.</p>
</section>

<section class="artwork cubism-art">
  <div class="art-container">
    <img src="images/P1.jpeg">
    <div class="note">Cubist breakdown of perception and form.</div>
  </div>
</section>

<section class="artwork abstract-art">
  <div class="art-container">
    <img src="images/schizophrenia.jpeg">
    <div class="note">Abstract exploration of chaos and calm.</div>
  </div>
</section>

<div class="overlay" id="contactPanel">
  <h2>Contact</h2>
  <p>Durali Demir</p>
  <p>d.demir@dudu-art-gallery.com</p>
  <button onclick="closePanels()">Close</button>
</div>

<div class="overlay" id="rentalPanel">
  <h2>Art-Rental</h2>
  <button onclick="closePanels()">Close</button>
</div>

<script>
function toggleMode(){
  const body=document.body;
  if(body.classList.contains("abstract")){
    body.classList.remove("abstract");
    body.classList.add("cubism");
  }else{
    body.classList.remove("cubism");
    body.classList.add("abstract");
  }
}

function openContact(){document.getElementById("contactPanel").classList.add("active");}
function openRental(){document.getElementById("rentalPanel").classList.add("active");}
function closePanels(){document.querySelectorAll(".overlay").forEach(p=>p.classList.remove("active"));}

document.querySelectorAll('.art-container').forEach(container=>{
  const img=container.querySelector('img');
  const note=container.querySelector('.note');
  img.addEventListener('click',()=>container.classList.add('active'));
  note.addEventListener('click',(e)=>{e.stopPropagation();container.classList.remove('active');});
});
</script>

</body>
</html>
