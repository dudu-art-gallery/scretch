<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

:root {
  --bg: #ffffff;
  --text: #111;
  --accent: #111;
  --soft: #f5f5f5;
}

body.dark {
  --bg: #0e0e0e;
  --text: #f5f5f5;
  --accent: #ffffff;
  --soft: #1a1a1a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.4s ease;
  overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
  position: fixed;
  width: 100%;
  padding: 25px 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(15px);
  z-index: 1000;
  transition: 0.4s ease;
}

body.dark header {
  background: rgba(15,15,15,0.6);
}

.logo {
  letter-spacing: 4px;
  font-weight: 500;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 40px;
}

nav a {
  text-decoration: none;
  color: var(--text);
  font-size: 14px;
  letter-spacing: 2px;
}

.toggle-dark {
  cursor: pointer;
  font-size: 14px;
  letter-spacing: 2px;
}

/* ================= HERO ================= */

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-top: 80px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero img {
  width: 70%;
  max-width: 1100px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.2);
  transition: transform 0.6s ease;
}

.hero img:hover {
  transform: scale(1.03);
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 15px;
}

.hero p {
  margin-bottom: 50px;
  color: gray;
}

/* ================= SECTION ================= */

.section {
  padding: 140px 100px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 60px;
}

.card {
  cursor: pointer;
  transition: 0.6s ease;
}

.card img {
  width: 100%;
  transition: 0.6s ease;
}

.card:hover img {
  transform: scale(1.05);
}

.card-info {
  margin-top: 20px;
  font-size: 14px;
  letter-spacing: 2px;
}

button {
  margin-top: 10px;
  padding: 8px 18px;
  border: 1px solid var(--text);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: 0.4s ease;
}

button:hover {
  background: var(--text);
  color: var(--bg);
}

/* ================= FOOTER ================= */

footer {
  padding: 100px;
  background: var(--soft);
}

/* ================= MODAL ================= */

.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.modal img {
  max-width: 80%;
  max-height: 80%;
}

.modal.active {
  display: flex;
}

/* ================= MOBILE ================= */

@media(max-width: 1000px){
  header { padding: 20px 30px; }
  .grid { grid-template-columns: 1fr; }
  .section { padding: 80px 30px; }
  .hero img { width: 90%; }
}

</style>
</head>
<body>

<header>
  <div class="logo">DUDU</div>
  <nav>
    <ul>
      <li><a href="#collection">COLLECTION</a></li>
      <li><a href="#contact">CONTACT</a></li>
      <li class="toggle-dark" onclick="toggleDark()">MODE</li>
      <li onclick="openCart()">CART (<span id="cart-count">0</span>)</li>
    </ul>
  </nav>
</header>

<section class="hero">
  <h1>dudu art gallery</h1>
  <p>every masterpiece was once a scratch</p>
  <img src="images/busniess card.jpeg" id="parallax">
</section>

<section class="section" id="collection">
  <div class="grid">

    <div class="card" onclick="openModal(this)">
      <img src="images/P1.jpeg">
      <div class="card-info">P1</div>
     
    </div>

    <div class="card" onclick="openModal(this)">
      <img src="images/fell in love.jpeg">
      <div class="card-info">FELL IN LOVE</div>
     
    </div>

    <div class="card" onclick="openModal(this)">
      <img src="images/P2.jpeg">
      <div class="card-info">P2</div>
    </div>

  </div>
</section>

<footer id="contact">
  <strong>DUDU ART GALLERY</strong><br>
  81929 Munich<br>
  +49 176 416 292 50<br>
  d.demir@dudu-art-gallery.com
</footer>

<div class="modal" id="modal" onclick="closeModal()">
  <img id="modal-img">
</div>

<script>

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

/* MODAL */
function openModal(card){
  const img = card.querySelector("img").src;
  document.getElementById("modal-img").src = img;
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

/* PARALLAX */
window.addEventListener("scroll", function(){
  const img = document.getElementById("parallax");
  let offset = window.pageYOffset;
  img.style.transform = "translateY(" + offset * 0.2 + "px)";
});


</script>

</body>
</html>
