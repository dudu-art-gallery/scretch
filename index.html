<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dudu art gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: #ffffff;
  color: #111;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
}

/* ================= NAVIGATION ================= */

header {
  width: 100%;
  padding: 25px 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
  transition: 0.4s ease;
}

.logo {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 4px;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 50px;
}

nav a {
  text-decoration: none;
  color: #111;
  font-weight: 400;
  font-size: 14px;
  letter-spacing: 2px;
  position: relative;
}

nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 1px;
  bottom: -6px;
  left: 0;
  background: #111;
  transition: 0.4s ease;
}

nav a:hover::after {
  width: 100%;
}

.hamburger {
  display: none;
  font-size: 26px;
  cursor: pointer;
}

/* ================= HERO ================= */

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-top: 80px;
  text-align: center;
}

.hero h1 {
  font-size: 56px;
  font-weight: 400;
  letter-spacing: 3px;
  margin-bottom: 15px;
  animation: fadeDown 1.2s ease forwards;
}

.hero p {
  font-size: 18px;
  color: #666;
  margin-bottom: 50px;
  animation: fadeUp 1.5s ease forwards;
}

.hero img {
  width: 70%;
  max-width: 1100px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.15);
  transition: 0.6s ease;
  animation: fadeUp 2s ease forwards;
}

.hero img:hover {
  transform: scale(1.02);
}

/* ================= SECTION ================= */

.section {
  padding: 140px 100px;
}

.section-title {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 3px;
  margin-bottom: 60px;
}

/* ================= GRID ================= */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px;
}

.card {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(60px);
  transition: 0.8s ease;
}

.card img {
  width: 100%;
  transition: 0.8s ease;
}

.card:hover img {
  transform: scale(1.05);
}

.card-info {
  margin-top: 20px;
  font-size: 14px;
  letter-spacing: 2px;
}

/* ================= FOOTER ================= */

footer {
  padding: 100px;
  background: #f5f5f5;
  font-size: 14px;
  letter-spacing: 1px;
  line-height: 2;
}

/* ================= ANIMATIONS ================= */

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= MOBILE ================= */

@media (max-width: 1000px) {

  header {
    padding: 20px 30px;
  }

  nav ul {
    position: absolute;
    top: 80px;
    right: 0;
    background: white;
    flex-direction: column;
    width: 220px;
    padding: 40px;
    display: none;
    box-shadow: -10px 10px 30px rgba(0,0,0,0.05);
  }

  nav ul.active {
    display: flex;
  }

  .hamburger {
    display: block;
  }

  .hero h1 {
    font-size: 32px;
  }

  .hero img {
    width: 90%;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .section {
    padding: 80px 30px;
  }

  footer {
    padding: 60px 30px;
  }

}

</style>
</head>
<body>

<header>
  <div class="logo">DUDU</div>

  <nav>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <ul id="menu">
      <li><a href="#cubism">CUBISM</a></li>
      <li><a href="#contact">CONTACT</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <h1>dudu art gallery</h1>
  <p>every masterpiece was once a scratch</p>
  <img src="images/busniess card.jpeg" alt="Main Artwork">
</section>

<section class="section" id="cubism">
  <div class="section-title">CUBISM COLLECTION</div>

  <div class="grid">
    <div class="card">
      <img src="images/P1.jpeg">
      <div class="card-info">P1</div>
    </div>

    <div class="card">
      <img src="images/fell in love.jpeg">
      <div class="card-info">FELL IN LOVE</div>
    </div>

    <div class="card">
      <img src="images/P2.jpeg">
      <div class="card-info">P2</div>
    </div>
  </div>
</section>

<footer id="contact">
  <strong>DUDU ART GALLERY</strong><br>
  81929 Munich<br>
  +49 176 416 292 50<br>
  d.demir@dudu-art-gallery.com
</footer>

<script>

function toggleMenu() {
  document.getElementById("menu").classList.toggle("active");
}

/* Scroll Reveal */
const cards = document.querySelectorAll('.card');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.style.opacity = 1;
      entry.target.style.transform = "translateY(0)";
    }
  });
}, { threshold: 0.2 });

cards.forEach(card => observer.observe(card));

</script>

</body>
</html>
