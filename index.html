<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DUDU Virtual Gallery</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
#info {
  position:absolute;
  top:20px;
  left:20px;
  color:white;
  font-family:Arial;
  z-index:10;
}
button {
  padding:10px 20px;
  background:black;
  color:white;
  border:1px solid white;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="info">
  <button onclick="goBack()">Back to Gallery</button>
  <p>WASD to move · Mouse to look</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/PointerLockControls.js"></script>

<script>

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.y = 1.6;

let renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Lighting */
let ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

let spotLight = new THREE.SpotLight(0xffffff, 1);
spotLight.position.set(0,5,0);
scene.add(spotLight);

/* Floor */
let floorGeometry = new THREE.PlaneGeometry(20,20);
let floorMaterial = new THREE.MeshStandardMaterial({ color:0x111111 });
let floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* Walls */
let wallMaterial = new THREE.MeshStandardMaterial({ color:0x1a1a1a });

function createWall(x,z,rot){
  let wall = new THREE.Mesh(
    new THREE.PlaneGeometry(20,5),
    wallMaterial
  );
  wall.position.set(x,2.5,z);
  wall.rotation.y = rot;
  scene.add(wall);
}

createWall(0,-10,0);
createWall(0,10,Math.PI);
createWall(-10,0,Math.PI/2);
createWall(10,0,-Math.PI/2);

/* Add Paintings */
let textureLoader = new THREE.TextureLoader();

function addPainting(url,x,y,z,rot){
  let texture = textureLoader.load(url);
  let painting = new THREE.Mesh(
    new THREE.PlaneGeometry(3,4),
    new THREE.MeshStandardMaterial({ map:texture })
  );
  painting.position.set(x,y,z);
  painting.rotation.y = rot;
  scene.add(painting);
}

addPainting("images/P1.jpeg", -5,2,-9.9,0);
addPainting("images/P2.jpeg", 5,2,-9.9,0);

/* Controls */
let controls = new THREE.PointerLockControls(camera, document.body);

document.body.addEventListener("click", () => {
  controls.lock();
});

scene.add(controls.getObject());

let moveForward=false, moveBackward=false, moveLeft=false, moveRight=false;

document.addEventListener("keydown", e=>{
  if(e.code==="KeyW") moveForward=true;
  if(e.code==="KeyS") moveBackward=true;
  if(e.code==="KeyA") moveLeft=true;
  if(e.code==="KeyD") moveRight=true;
});

document.addEventListener("keyup", e=>{
  if(e.code==="KeyW") moveForward=false;
  if(e.code==="KeyS") moveBackward=false;
  if(e.code==="KeyA") moveLeft=false;
  if(e.code==="KeyD") moveRight=false;
});

function animate(){
  requestAnimationFrame(animate);

  let speed = 0.1;

  if(moveForward) controls.moveForward(speed);
  if(moveBackward) controls.moveForward(-speed);
  if(moveLeft) controls.moveRight(-speed);
  if(moveRight) controls.moveRight(speed);

  renderer.render(scene,camera);
}

animate();

/* Resize */
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function goBack(){
  window.location.href = "index.html";
}

</script>

</body>
</html>
