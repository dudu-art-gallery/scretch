<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU - Art Rental Gallery</title>

<link rel="icon" type="images/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#0d0d0d;
  --muted:#555;
  --accent:#8B2C2C;
}
body.abstract{
  --bg:#0d0d0d;
  --text:#f2f2f2;
  --muted:#888;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;transition:background 0.8s ease;}

/* ENTRY */
.entry{position:fixed;inset:0;background:#ffffff;display:flex;justify-content:center;align-items:center;z-index:10000;transition:opacity 1s ease;}
.entry.hidden{opacity:0;pointer-events:none;}
.entry h1{font-family:'Cormorant Garamond',serif;font-size:80px;color:#000;letter-spacing:8px;animation:fadeIn 1s forwards;}

button{border:1px solid var(--text);background:transparent;color:var(--text);padding:8px 14px;font-size:13px;cursor:pointer;transition:0.3s;}
button:hover{background:var(--accent);color:#000;}
.back-btn{border:2px solid #000;color:#fff;background:#000;font-weight:bold;padding:10px 20px;margin-top:auto;margin-bottom:30px;cursor:pointer;transition:0.3s;}
.back-btn:hover{background:#fff;color:#000;}
.overlay{position:fixed;inset:0;background:#e5e5e5;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:0.4s;z-index:2000;overflow-y:auto;padding:60px 20px;}
.overlay.active{opacity:1;pointer-events:auto;}
.gallery{padding:40px 20px;text-align:center;}
.gallery h2{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:60px;color:var(--text);}
.gallery-grid{display:grid;grid-template-columns:1fr;gap:200px;justify-items:center;margin-bottom:100px;}
.gallery-grid div{text-align:center;}
.gallery-grid img{width:80%;max-width:500px;height:auto;box-shadow:0 8px 30px rgba(0,0,0,0.25);}
.artist-text,.dedication-text{max-width:800px;line-height:1.8;text-align:justify;font-size:16px;color:#000;}
.profile-pic{width:160px;margin-bottom:30px;}
@media(max-width:768px){
  .gallery-grid img{max-width:300px;width:90%;}
  .gallery-grid{gap:150px;}
  .artist-text{font-size:15px;}
}
@keyframes fadeIn{to{opacity:1;}}
</style>
</head>
<body class="cubism">

<!-- ENTRY -->
<div class="entry" id="entryScreen"><h1>DUDU</h1></div>

<!-- LANGUAGE SWITCH -->
<button onclick="toggleLanguage()" id="langBtn" style="position:fixed;top:20px;right:20px;"></button>

<!-- INTRO -->
<section class="intro" style="text-align:center;margin-top:100px;">
<h2 id="title"></h2>
<p id="subtitle"></p>
<button onclick="openArtistInfo()" id="infoBtn"></button>
<button onclick="openDedicationInfo()" id="dedicationBtn"></button>
</section>

<!-- ARTIST PANEL -->
<div class="overlay" id="artistPanel">
<h2 id="artistTitle"></h2>
<div class="artist-text" id="artistText"></div>
<button onclick="closePanels()" class="back-btn" id="backBtn1"></button>
</div>

<!-- DEDICATION PANEL -->
<div class="overlay" id="dedicationPanel">
<h2>DUDU</h2>
<div class="dedication-text" id="dedicationText"></div>
<button onclick="closePanels()" class="back-btn" id="backBtn2"></button>
</div>

<!-- GALLERY -->
<section class="gallery">
<h2 id="galleryTitle"></h2>
<div class="gallery-grid">
  <div><img src="images/P1.jpeg"><p id="title_p1"></p><button onclick="openPainting('p1')" id="btn_p1"></button></div>
  <div><img src="images/P2.jpg"><p id="title_p2"></p><button onclick="openPainting('p2')" id="btn_p2"></button></div>
  <div><img src="images/fell in love.jpeg"><p id="title_fell"></p><button onclick="openPainting('fell')" id="btn_fell"></button></div>
  <div><img src="images/lucid.jpg"><p id="title_lucid"></p><button onclick="openPainting('lucid')" id="btn_lucid"></button></div>
  <div><img src="images/hope in the darkness.jpg"><p id="title_hope"></p><button onclick="openPainting('hope')" id="btn_hope"></button></div>
  <div><img src="images/schizophrenia.jpeg"><p id="title_schiz"></p><button onclick="openPainting('schiz')" id="btn_schiz"></button></div>
  <div><img src="images/the face.jpg"><p id="title_face"></p><button onclick="openPainting('face')" id="btn_face"></button></div>
</div>
</section>

<!-- PAINTING PAGE -->
<div class="overlay" id="paintingPage">
<h2 id="paintingTitle"></h2>
<img id="paintingImage" style="max-width:500px;width:90%;margin:20px 0;">
<div id="paintingHistory"></div>
<button onclick="closePanels()" class="back-btn" id="backBtn3"></button>
</div>

<script>
// ENTRY SCREEN
window.addEventListener("load", () => {
  setTimeout(() => {
    const e = document.getElementById("entryScreen");
    e.classList.add("hidden");
    e.addEventListener("transitionend", () => {
      e.style.display = "none";
    });
  }, 1000);
});

// TRANSLATION DATA
let lang="de";

const t={
de:{
title:"Galerie zur Kunstvermietung",
subtitle:"Wir erschaffen Kunst auf Anfrage.",
info:"Info",
dedication:"Widmung",
history:"Geschichte",
back:"Zurück",
gallery:"Kubismus",
artistTitle:"DUDU – Künstler",
artistText:[
"Ich fürchtete Gott und nur Gott.",
"Ich stand am Rand meiner Lebenszeit.",
"Ich vergab meinen Nächsten und sah ihnen ein letztes Mal in die Gesichter.",
"Gott vergab mir, doch ich konnte meinem früheren Ich niemals vergeben.",
"Ich sprach mein letztes Gebet und war bereit zu sterben.",
"Nicht weil ich sterben wollte, sondern weil ich bereit war zu sterben.",
"September, 2024: Ich liege im Krankenhausbett.",
"Ich verliere mich in den Stimmen, die ich höre.",
"Ich schlafe allein, aber nicht vollständig allein, denn Gott ist an meiner Seite."
],
dedicationText:"Ich widme alle meine Gemälde den psychisch beeinträchtigten Menschen dieser Welt. Diese Sammlung ist eine Zusammenfassung zwischen Ordnung und Chaos. Leben, vom Unvermögen zu fliegen bis zum befreienden Moment des Ausbruchs aus dem Kokon.",
paintings:{
p1:{title:"P1",history:"Rot fragt nicht nach Leben. Es nimmt es."},
p2:{title:"P2",history:"Gelb fragt nicht nach Licht. Es nimmt es."},
fell:{title:"Verliebt",history:"Verliebt zu sein ist nicht unter deiner Kontrolle. Nur Gott entscheidet, wen du lieben wirst."},
lucid:{title:"Luzid",history:"Es ist klar vor dir, aber du kannst es nicht sehen."},
hope:{title:"Hoffnung in der Dunkelheit",history:"Zwischen Licht und Dunkelheit. Zwischen Hoffnung und Bruch. Es gibt immer einen Kampf."},
schiz:{title:"Verloren in Stimmen",history:"Die Verletzlichsten. Die Ängstlichsten. Die Eingeschränktesten. Die Gefürchtetsten."},
face:{title:"Gekettet",history:"In deinen Gedanken gefangen. Es gibt keinen Ausweg. Das Böse folgt."}
}
},
en:{
title:"Art Rental Gallery",
subtitle:"We create upon request.",
info:"Info",
dedication:"Dedication",
history:"History",
back:"Back",
gallery:"Cubism",
artistTitle:"DUDU - Artist",
artistText:[
"I feared God and God only.",
"I was at the edge of my lifespan.",
"I forgave my closest and looked one last time into their faces.",
"God forgave me, but I could never forgive my past self.",
"I prayed my last prayer and was ready to die.",
"Not because I wanted to die, but because I was ready to die.",
"September, 2024: lying in bed at the hospital.",
"I am lost in the voices I am hearing.",
"I am sleeping alone, but not entirely alone, because I have God on my side."
],
dedicationText:"I dedicate all my paintings to the psychologically disabled people in the world. This collection is a summary between order and chaos. Life, from being unable to fly to the liberating moment of breaking out from the cocoon and just flying.",
paintings:{
p1:{title:"P1",history:"Red doesn't ask for life. It takes it."},
p2:{title:"P2",history:"Yellow doesn't ask for light. It takes it."},
fell:{title:"Fell in Love",history:"Falling in love is not under your control. Only God decides who you are going to love."},
lucid:{title:"Lucid",history:"It is clearly in front of you but you can't see it."},
hope:{title:"Hope in the Darkness",history:"Between light and darkness. Between hope and rupture. There is always a fight."},
schiz:{title:"Lost in Voices",history:"The most vulnerable. The most anxious. The most restricted. The most feared."},
face:{title:"Chained",history:"Captured in your thoughts. There is no way out. Evil follows."}
}
}
};

function applyLanguage(){
const L=t[lang];
document.getElementById("title").textContent=L.title;
document.getElementById("subtitle").textContent=L.subtitle;
document.getElementById("infoBtn").textContent=L.info;
document.getElementById("dedicationBtn").textContent=L.dedication;
document.getElementById("galleryTitle").textContent=L.gallery;
document.getElementById("backBtn1").textContent=L.back;
document.getElementById("backBtn2").textContent=L.back;
document.getElementById("backBtn3").textContent=L.back;
document.getElementById("langBtn").textContent=(lang==="de")?"EN":"DE";
document.getElementById("artistTitle").textContent=L.artistTitle;
document.getElementById("artistText").innerHTML=L.artistText.map(p=>"<p>"+p+"</p>").join("");
document.getElementById("dedicationText").textContent=L.dedicationText;
for(let id in L.paintings){
document.getElementById("title_"+id).textContent=L.paintings[id].title;
document.getElementById("btn_"+id).textContent=L.history;
}
}

function toggleLanguage(){
lang=(lang==="de")?"en":"de";
applyLanguage();
}

function openArtistInfo(){closePanels();document.getElementById("artistPanel").classList.add("active");}
function openDedicationInfo(){closePanels();document.getElementById("dedicationPanel").classList.add("active");}
function closePanels(){document.querySelectorAll(".overlay").forEach(p=>p.classList.remove("active"));}
function openPainting(id){
const L=t[lang];
document.getElementById("paintingTitle").textContent=L.paintings[id].title;
document.getElementById("paintingImage").src="images/"+id+".jpg";
document.getElementById("paintingHistory").textContent=L.paintings[id].history;
document.getElementById("paintingPage").classList.add("active");
}

// INITIALIZE
applyLanguage();
</script>

</body>
</html>
