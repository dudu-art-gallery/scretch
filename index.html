<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUDU - Art Rental Gallery</title>

<link rel="icon" type="images/png" href="images/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#0d0d0d;
  --muted:#555;
  --accent:#8B2C2C;
}

body.abstract{
  --bg:#0d0d0d;
  --text:#f2f2f2;
  --muted:#888;
  --accent:#8B2C2C;
}

{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  transition:background 0.8s ease;
  overflow-x:hidden;
}

/ ENTRY SCREEN /

.entry{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10000;
  transition:opacity 1s ease;
}

.entry.hidden{opacity:0;pointer-events:none;}

.entry h1{
  font-family:'Cormorant Garamond',serif;
  font-size:80px;
  color:#fff;
  letter-spacing:8px;
  animation:fadeIn 2s forwards;
}

/ TOP BAR /

.mode-switch{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:1000;
  padding:10px 8px;
  gap:4px;
}

.mode-switch.scrolled{
  backdrop-filter: blur(14px);
  background: rgba(0,0,0,0.35);
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.top-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.bottom-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

button{
  border:1px solid var(--text);
  background:transparent;
  color:var(--text);
  padding:8px 14px;
  font-size:13px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:var(--accent);
  color:#000;
}

/ SWITCH /

.switch{
  width:60px;
  height:28px;
  background:#000;
  border-radius:50px;
  position:relative;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.2);
}

.switch::before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  background:#fff;
  top:3px;
  left:4px;
  border-radius:50%;
  transition:0.4s ease;
}

body.cubism .switch::before{
  transform:translateX(30px);
}

/ SIDE MENU /

.side-menu{
  position:fixed;
  top:0;
  right:-280px;
  width:260px;
  height:100vh;
  background:rgba(10,10,10,0.85);
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  transition:0.5s ease;
  z-index:3000;
}

.side-menu.active{
  right:0;
}

.side-menu button{
  width:180px;
}

.menu-close{
  position:absolute;
  top:20px;
  right:20px;
}

/ INTRO /

section.intro{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:80px 20px 60px;
}

section.intro h2{
  font-family:'Cormorant Garamond',serif;
  font-size:24px;
  margin-bottom:35px;
  letter-spacing:2px;
}

section.intro p{
  max-width:700px;
  color:var(--muted);
  line-height:2;
  font-size:18px;
}

/ ARTWORK /

.artwork{
  display:none;
  flex-direction:column;
  align-items:center;
}

body.cubism .cubism-art,
body.abstract .abstract-art{
  display:flex;
}

.art-container{
  width:90%;
  max-width:900px;
  margin-bottom:220px;
  position:relative;
  text-align:center;
}

.art-container img{
  width:100%;
  cursor:pointer;
  transition:0.4s ease;
}

.art-container img:hover{
  transform:scale(1.02);
}

body.cubism .art-container img{
  clip-path: polygon(0 0, 100% 10%, 90% 100%, 10% 90%);
  transform: rotate(-2deg);
}

/ TITLES /

.art-title{
  margin-top:20px;
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
}

.art-subtitle{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

/ NOTES /

.note{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:24px;
  background:rgba(0,0,0,0.92);
  opacity:0;
  transform:scale(0.96);
  pointer-events:none;
  font-size:1.5rem;
  letter-spacing:1.2px;
  line-height:1.8;
  max-width:1200px;
  margin:auto;
  transition:opacity 0.45s ease, transform 0.45s ease;
}

body.abstract .note{
  clip-path: polygon(20% 0%, 100% 10%, 80% 100%, 0% 90%);
}

body.cubism .note{
  clip-path: polygon(0 0, 100% 5%, 95% 100%, 5% 95%);
}

.art-container.active .note{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}

.art-container.active img{
  filter:blur(3px) brightness(0.55);
}

/ OVERLAYS */

.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:0.4s ease;
  z-index:2000;
  padding:40px;
  text-align:center;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

.profile-pic{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:20px;
}

.pdf-preview{
  width:90%;
  max-width:900px;
  height:70vh;
  margin:30px 0;
  overflow:auto;
  border:1px solid rgba(255,255,255,0.2);
}

.pdf-preview iframe{
  width:100%;
  height:100%;
  border:none;
}

@keyframes fadeIn{
  to{opacity:1;}
}
</style>
</head>

<body class="cubism">

<div class="entry" id="entryScreen"><h1>DUDU</h1></div>

<div class="mode-switch" id="topBar">

<div class="top-row">
<button onclick="toggleMenu()">Menu</button>
</div>

<div class="bottom-row">
<span>Abstract</span>
<div class="switch" onclick="toggleMode()"></div>
<span>Cubism</span>
</div>

</div>

<!-- SIDE MENU -->

<div class="side-menu" id="sideMenu">

<button class="menu-close" onclick="toggleMenu()">✕</button>

<button class="contact-btn">Contact</button>
<button class="rental-btn">Art-Rental</button>
<button class="lang-btn" onclick="toggleLanguage()">DE</button>

</div>

<section class="intro">
<h2 id="title">art rental gallery</h2>
<p id="subtitle">we create upon request.</p>
</section>

<!-- (Your artworks remain exactly the same as before) -->

<!-- CONTACT PANEL -->

<div class="overlay" id="contactPanel">

<img src="images/Durali Demir.jpg" class="profile-pic">

<h2>Durali Demir</h2>
<p>Founder & Curator</p>
<p>d.demir@dudu-art-gallery.com</p>
<p>Munich, Germany</p>

<button onclick="closePanels()">Close</button>

</div>

<!-- RENTAL PANEL -->

<div class="overlay" id="rentalPanel">

<h2>Art-Rental</h2>

<div class="pdf-preview">
<iframe src="images/Art-Rental.pdf"></iframe>
</div>

<a href="images/Art-Rental.pdf" download>Download PDF</a>

<button onclick="closePanels()">Close</button>

</div>

<script>

window.addEventListener("load",()=>{
setTimeout(()=>document.getElementById("entryScreen").classList.add("hidden"),3000);
});

function toggleMode(){
document.body.classList.toggle("abstract");
document.body.classList.toggle("cubism");
}

function toggleMenu(){
document.getElementById("sideMenu").classList.toggle("active");
}

window.addEventListener("scroll",()=>{
document.getElementById("topBar").classList.toggle("scrolled",window.scrollY>50);
});

document.querySelector(".contact-btn").onclick=()=>{
document.getElementById("contactPanel").classList.add("active");
};

document.querySelector(".rental-btn").onclick=()=>{
document.getElementById("rentalPanel").classList.add("active");
};

function closePanels(){
document.querySelectorAll(".overlay").forEach(p=>p.classList.remove("active"));
}

let lang='de';

function applyLanguage(){

document.querySelectorAll('.art-title').forEach(el=>el.textContent=el.dataset[lang]);
document.querySelectorAll('.art-subtitle').forEach(el=>el.textContent=el.dataset[lang]);
document.querySelectorAll('.note').forEach(el=>el.textContent=el.dataset[lang]);

document.getElementById('title').textContent=(lang==='en')?'art rental gallery':'Galerie zur Kunstvermietung';

document.getElementById('subtitle').textContent=(lang==='en')?'We create upon request.':'Wir kreieren auf Anfrage.';

document.querySelector(".lang-btn").textContent=(lang==='en')?'DE':'EN';

}

function toggleLanguage(){
lang=(lang==='en')?'de':'en';
applyLanguage();
}

document.addEventListener("DOMContentLoaded",applyLanguage);

</script>

</body>
</html>
